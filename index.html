        /* Sticky master audio bar styling */
        .master-audio-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;

            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);

        /* Update your card style to wrap and expand automatically */
.card {
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    height: auto;
    color: white;
    
    padding: 15px;       /* Adds breathing room inside the border */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align:center ;
    box-sizing: border-box; /* Crucial to keep padding from making card overflow */
    overflow: hidden;       /* clips any rogue elements spilling outside */
}
.one{
    width:50px;
    border-radius: 10px;
    
}

/* Ensure figure takes up full width for perfect alignment */
figure {
    margin: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: space-between;
}

/* Spaces out buttons row beautifully inside the box */
.controls-row {
    margin-top: auto;   /* Pushes row to the absolute bottom of the card */
    padding-top: 1px;
    display: flex;
    gap: 6px;
    justify-content: center;
    width: 100%;
}

        .btn {
            background-color: #222;
            color: white;
            border: 1px solid #444;
            padding: 6px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            
        }
        .btn:hover {
            background-color: #1db954;
            border-color: #1db954;
        }
